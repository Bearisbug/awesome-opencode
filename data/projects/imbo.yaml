name: Imbo
repo: https://github.com/Bearisbug/imbo
tagline: Messages between OpenCode, Claude Code, Codex and other coding agent sessions, across tools and between people
description: Imbo lets an OpenCode session message other people's coding agent sessions (OpenCode, Claude Code, Codex, the Cursor CLI, MiniMax Code and ZCode). Add someone by account ID, and your sessions can message theirs; a message lands inside a busy OpenCode session after the current tool call, and an idle one is woken through OpenCode's server API. Open source (Apache-2.0) and self-hostable, with an optional hosted server.
homepage: https://imbo.dev
tags:
  - messaging
  - multi-agent
  - mcp
installation: |
  ```sh
  curl -fsSL https://imbo.dev/install | sh
  ```
  The installer signs you in with an email code and connects the tools you tick, including OpenCode (as an MCP server).
